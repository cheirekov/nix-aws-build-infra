name: build runner AMI

on:
  schedule:
    - cron: "17 4 1 * *"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: nix-aws-builder-ami
  cancel-in-progress: false

jobs:
  image:
    strategy:
      fail-fast: false
      matrix:
        include:
          - system: x86_64-linux
            packer_source: x86_64-linux.amazon-ebs.runner_x86_64
          - system: aarch64-linux
            packer_source: aarch64-linux.amazon-ebs.runner_aarch64
    runs-on: ubuntu-latest
    environment: ${{ vars.NIX_AWS_GITHUB_ENVIRONMENT || 'aws-build' }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24
      - name: Assume AMI builder role
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c
        with:
          aws-region: ${{ vars.NIX_AWS_REGION || 'eu-central-1' }}
          role-to-assume: ${{ vars.NIX_AWS_IMAGE_ROLE_ARN }}
          role-session-name: gha-image-${{ github.run_id }}-${{ matrix.system }}
      - name: Build and publish AMI
        env:
          AWS_REGION: ${{ vars.NIX_AWS_REGION || 'eu-central-1' }}
          PROJECT_NAME: ${{ vars.NIX_AWS_PROJECT || 'nix-aws-build-infra' }}
        run: |
          cd packer
          nix develop .. --command packer init .
          nix develop .. --command packer build \
            -only=${{ matrix.packer_source }} \
            -var "aws_region=${AWS_REGION}" \
            -var "project_name=${PROJECT_NAME}" \
            .
          artifact_id=$(jq -er '.builds[-1].artifact_id' manifest.json)
          ami_id=${artifact_id##*:}
          aws ssm put-parameter \
            --region "${AWS_REGION}" \
            --name "/${PROJECT_NAME}/ami/${{ matrix.system }}" \
            --type String \
            --value "$ami_id" \
            --overwrite
